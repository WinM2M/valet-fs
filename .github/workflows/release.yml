name: Release ValetFS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.19'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse-dev pkg-config build-essential

      - name: Build Linux binary
        run: |
          GOOS=linux GOARCH=${{ matrix.arch }} go build -ldflags="-s -w" -o valetfs-linux-${{ matrix.arch }} ./cmd/valetfs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: valetfs-linux-${{ matrix.arch }}
          path: valetfs-linux-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/valetfs-linux-amd64/valetfs-linux-amd64
            dist/valetfs-linux-arm64/valetfs-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
